backend:
  name: github
  repo: vyaovi-oss/kadopay
  branch: main

site_url: https://kadopay.shop
display_url: https://kadopay.shop

media_folder: assets/images
public_folder: /assets/images

collections:
  - name: articles
    label: Articles
    label_singular: Article
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{slug}}/"
    sortable_fields: [date, title]
    fields:
      - { label: "Titre", name: "title", widget: "string" }
      - { label: "Description pour Google (150 caractères max)", name: "description", widget: "text" }
      - { label: "Date de publication", name: "date", widget: "datetime" }
      - { label: "Image de couverture", name: "image", widget: "image", required: false }
      - { label: "Contenu de l'article", name: "body", widget: "markdown" }
