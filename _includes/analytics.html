<!-- Icône du site (favicon) -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#14211B">

<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-9LW3ESGJEZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-9LW3ESGJEZ');

  // Compte chaque clic vers WhatsApp (événement "clic_whatsapp")
  document.addEventListener('click', function (e) {
    var a = e.target.closest && e.target.closest('a[href*="wa.me"]');
    if (!a) return;
    var m = decodeURIComponent(a.href).match(/carte cadeau ([^.]+)\./i);
    gtag('event', 'clic_whatsapp', {
      carte: m ? m[1] : 'general',
      page: location.pathname
    });
  });
</script>
